name: Discord Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA (optional)"
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Send changelog to Orbit Sentinel API
        env:
          DISCORD_API: ${{ secrets.DISCORD_API }}
          API_URL: https://api.orbitstudios.net/api/github/commit
        shell: bash
        run: |
          set -e

          # Select commit
          TARGET_COMMIT=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_COMMIT="${{ github.event.inputs.commit_sha }}"
          fi

          if [ -n "$TARGET_COMMIT" ]; then
            git checkout "$TARGET_COMMIT"
          fi

          # Helpers
          json_escape () { jq -Rs . <<< "$1"; }

          # Commit data
          TITLE_RAW=$(git log -1 --pretty=%s)
          BODY_RAW=$(git log -1 --pretty=%b)
          [ -z "$BODY_RAW" ] && BODY_RAW="No additional details provided."

          # Changed files
          FILES_RAW=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -v '^.github/' || true)

          HTML_CHANGED=false
          FINAL_FILES=()

          while read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" == html/* ]]; then
              HTML_CHANGED=true
              continue
            fi
            FINAL_FILES+=("$file")
          done <<< "$FILES_RAW"

          [ "$HTML_CHANGED" = true ] && FINAL_FILES=("html/" "${FINAL_FILES[@]}")
          [ "${#FINAL_FILES[@]}" -eq 0 ] && FINAL_FILES=("No relevant file changes")

          FILES_FORMATTED=$(printf "%s\n" "${FINAL_FILES[@]}" | head -n 20 | sed 's/^/• 📁 /')

          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          DESCRIPTION="$BODY_RAW

          **📁 Changed files:**
          $FILES_FORMATTED

          *Update is available in the* **[Cfx.re Portal](https://portal.cfx.re/)**
          *It may take 5–10 minutes for the update to appear.*"

          # JSON payload
          curl --fail -X POST "$API_URL" \
            -H "Authorization: Bearer $DISCORD_API" \
            -H "Content-Type: application/json" \
            -d "{
              \"title\": $(json_escape "$TITLE_RAW"),
              \"description\": $(json_escape "$DESCRIPTION"),
              \"footer\": $(json_escape "$REPO_NAME")
            }"
